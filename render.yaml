services:
  - type: web
    name: mar-ci-connect
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        sync: false
      - key: VITE_ICE_SERVERS
        sync: false
      - key: MAX_ROOM_PARTICIPANTS
        value: 12